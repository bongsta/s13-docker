name: Docker build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: devopseasylearning/s13-training-camps

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Start container and smoke test
        run: |
          docker run --detach \
            --name s13-training-camps-ci \
            --publish 127.0.0.1:8080:8080 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:8080/api/courses
              exit 0
            fi
            sleep 2
          done

          docker logs s13-training-camps-ci
          exit 1

      - name: Show container status and logs
        if: always()
        run: |
          if ! docker container inspect s13-training-camps-ci >/dev/null 2>&1; then
            echo "The CI container was not created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docker ps --all --no-trunc \
            --filter name=s13-training-camps-ci \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

          container_id=$(docker inspect --format '{{.Id}}' s13-training-camps-ci)
          container_status=$(docker inspect --format '{{.State.Status}}' s13-training-camps-ci)
          health_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}not configured{{end}}' s13-training-camps-ci)
          {
            echo '### CI container'
            echo
            echo "| Name | Image | Status | Health |"
            echo "|---|---|---|---|"
            echo "| \`s13-training-camps-ci\` | \`${IMAGE_NAME}:${GITHUB_SHA}\` | \`${container_status}\` | \`${health_status}\` |"
            echo
            echo "Container ID: \`${container_id}\`"
            echo
            echo '#### Container logs'
            echo '```text'
            docker logs s13-training-camps-ci 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker logs s13-training-camps-ci

      - name: Capture website screenshot
        id: screenshot
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          npx --yes playwright@1.56.1 screenshot \
            --browser chromium \
            --full-page \
            http://127.0.0.1:8080 \
            s13-training-camps.png

      - name: Upload website screenshot
        id: upload-screenshot
        if: always() && steps.screenshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: s13-training-camps-screenshot
          path: s13-training-camps.png
          if-no-files-found: error

      - name: Link screenshot in job summary
        if: steps.upload-screenshot.outcome == 'success'
        env:
          SCREENSHOT_URL: ${{ steps.upload-screenshot.outputs.artifact-url }}
        run: echo "[Download the website screenshot](${SCREENSHOT_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: devopseasylearning
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
